# config/screener_config.yaml
# Sprint 3 (Days 15-21) — Nifty 100 Financial Intelligence Platform
# Analyst-editable thresholds. engine.py must never hardcode a number — always read from here.
# Column names verified against real nifty100.db schema on Day 15 (PRAGMA table_info).

metrics:
  # metric_key -> column in financial_ratios, unless noted otherwise
  roe: return_on_equity_pct
  roce: return_on_capital_employed_pct
  npm: net_profit_margin_pct
  opm: operating_profit_margin_pct
  de: debt_to_equity
  icr: interest_coverage
  total_debt: total_debt_cr
  fcf: free_cash_flow_cr
  capex: capex_cr
  eps: earnings_per_share
  book_value_per_share: book_value_per_share
  dividend_payout: dividend_payout_ratio_pct
  cfo: cash_from_operations_cr
  revenue_cagr_5yr: revenue_cagr_5yr
  pat_cagr_5yr: pat_cagr_5yr
  eps_cagr_5yr: eps_cagr_5yr
  roa: return_on_assets_pct
  asset_turnover: asset_turnover
  composite_quality_score: composite_quality_score
  net_profit: net_profit
  sales: sales
  pe: pe_ratio
  pb: pb_ratio
  dividend_yield: dividend_yield_pct
  market_cap: market_cap_crore
  ev_ebitda: ev_ebitda

sector_carveouts:
  de_skip_sectors: ["Financials"]

debt_free_rule:
  total_debt_tolerance_cr: 0.01

filterable_metrics:
  - {key: roe, direction: min}
  - {key: de, direction: max}
  - {key: fcf, direction: min}
  - {key: revenue_cagr_5yr, direction: min}
  - {key: pat_cagr_5yr, direction: min}
  - {key: opm, direction: min}
  - {key: pe, direction: max}
  - {key: pb, direction: max}
  - {key: dividend_yield, direction: min}
  - {key: icr, direction: min}
  - {key: market_cap, direction: min}
  - {key: net_profit, direction: min}
  - {key: eps_cagr_5yr, direction: min}
  - {key: asset_turnover, direction: min}
  - {key: sales, direction: min}

presets:
  quality_compounder:
    filters:
      - {metric: roe, op: ">", value: 15}
      - {metric: de, op: "<", value: 1.0}
      - {metric: fcf, op: ">", value: 0}
      - {metric: revenue_cagr_5yr, op: ">", value: 10}
    rank_by: composite_quality_score
    expected_count: [15, 35]

  value_pick:
    filters:
      - {metric: pe, op: "<", value: 50}
      - {metric: pb, op: "<", value: 5.0}
      - {metric: de, op: "<", value: 2.0}
      - {metric: dividend_yield, op: ">", value: 1}
    rank_by: fcf_yield_pct
    expected_count: [10, 25]

  growth_accelerator:
    filters:
      - {metric: pat_cagr_5yr, op: ">", value: 20}
      - {metric: revenue_cagr_5yr, op: ">", value: 15}
      - {metric: de, op: "<", value: 2.0}
    rank_by: pat_cagr_5yr
    expected_count: [8, 20]

  dividend_champion:
    filters:
      - {metric: dividend_yield, op: ">", value: 3.5}
      - {metric: dividend_payout, op: "<", value: 80}
      - {metric: fcf, op: ">", value: 0}
    rank_by: dividend_yield
    expected_count: [10, 20]

  debt_free_blue_chip:
    # KNOWN ISSUE from Day 16 (INDIGO qualifying with ROE=892.6%, a
    # near-zero-historic-equity artifact) is RESOLVED as of Day 17:
    # screener_export.py now applies Day 13's sanity-bound check
    # (src/analytics/edge_cases.py) universe-wide before any preset
    # filtering, masking implausible ROE/ROCE to NaN for HAL/BEL/INDIGO/
    # ICICIPRULI/HDFCLIFE. INDIGO no longer qualifies for this preset
    # (confirmed via day17_diagnose_preset_shift.py: 20->19 companies).
    # This filter-time masking is separate from run_custom_screen() calls
    # made directly against a RAW (unmasked) universe elsewhere (e.g. ad
    # hoc diagnostics) -- those will still show the unmasked 20-company
    # result, which is expected and fine for exploratory scripts.
    exclude_sectors: ["Financials"]
    filters:
      - {metric: de, op: "<", value: 0.1}
      - {metric: roe, op: ">", value: 12}
      - {metric: sales, op: ">", value: 5000}
    rank_by: roe
    expected_count: [15, 30]

  turnaround_watch:
    special_conditions:
      - revenue_cagr_3yr_gt_10
      - fcf_latest_year_positive
      - de_declining_yoy
    rank_by: revenue_cagr_3yr
    expected_count: [5, 15]

composite_score_weights:
  profitability:
    weight: 0.35
    roe: 0.15
    roce: 0.10
    npm: 0.10
  cash_quality:
    weight: 0.30
    fcf_cagr_5yr: 0.15
    cfo_pat_ratio: 0.10
    fcf_positive_flag: 0.05
  growth:
    weight: 0.20
    revenue_cagr_5yr: 0.10
    pat_cagr_5yr: 0.10
  leverage:
    weight: 0.15
    de_score: 0.10
    icr_score: 0.05